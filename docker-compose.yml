# Local container stack: gateway + operator dashboard.
#
#   docker compose up --build
#
# Runs against cloud backends by default because a container cannot reach an
# Ollama instance on the host without extra plumbing. Supply GROQ_API_KEY in
# a .env file beside this one; Compose reads it automatically.
#
# To run against local Ollama instead, set BACKENDS_CONFIG_PATH to
# configs/backends.yaml and point the endpoints in it at
# host.docker.internal:11434 rather than localhost.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CLIENT_API_KEY_TIER1: ${CLIENT_API_KEY_TIER1:-sk-test-tier-1}
      CLIENT_API_KEY_DEMO: ${CLIENT_API_KEY_DEMO:-sk-demo-live}
      BACKENDS_CONFIG_PATH: configs/backends.cloud.yaml
      LEDGER_DB_PATH: /app/data/ledger.db
    volumes:
      # Keeps spend history across restarts. Without this the ledger — and
      # every budget already consumed — resets whenever the container does.
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: dashboard.Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Service name, not localhost — inside the network the gateway is
      # reachable by its Compose service name.
      GATEWAY_URL: http://gateway:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      CLIENT_API_KEY_TIER1: ${CLIENT_API_KEY_TIER1:-sk-test-tier-1}
    depends_on:
      gateway:
        condition: service_started
